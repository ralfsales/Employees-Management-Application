<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employees Management Application</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Employees Management Application</h1>
      <p>Internal HR search system for employee records.</p>
    </header>

    <section class="notice">
      <strong>Privacy Notice:</strong>
      Employee records are not displayed by default. Use filters to search for specific employee information.
    </section>

    <section class="filter-panel">
      <h2>Search Employee Records</h2>

      <select id="departmentFilter">
        <option value="">Filter by Department</option>
        <option value="HR">HR</option>
        <option value="Sales">Sales</option>
        <option value="Development">Development</option>
        <option value="Projects">Projects</option>
        <option value="IT Support">IT Support</option>
      </select>

      <select id="roleFilter">
        <option value="">Filter by Role</option>
        <option value="Project Manager">Project Manager</option>
        <option value="HR Analyst">HR Analyst</option>
        <option value="Software Developer">Software Developer</option>
        <option value="Sales Supervisor">Sales Supervisor</option>
        <option value="IT Technician">IT Technician</option>
      </select>

      <select id="levelFilter">
        <option value="">Filter by Level</option>
        <option value="Junior">Junior</option>
        <option value="Mid-Level">Mid-Level</option>
        <option value="Senior">Senior</option>
      </select>

      <div class="buttons">
        <button onclick="searchEmployees()">Search Records</button>
        <button class="secondary" onclick="clearFilters()">Clear Filters</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
